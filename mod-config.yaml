# Eden World Builder Mod runtime configuration.
# This file must remain beside Eden - Modded.exe.

# Rates are placements/breaks per second; `max` means every game update.
# Up to eight presets are supported, in the order shown here.
autoplace_presets: [5, 10, 20, 50, max]

# Ranges are blocks; `unlimited` uses Eden's practical ray-march limit.
# Values above 448 are ignored for safety.
range_presets: [20, 50, 100, unlimited]

# Additional safe interface and macro preferences.
status_panel: true
caps_lock_macro_repeat: true

# Acceleration is added per update. Deceleration is momentum retained while
# coasting: 0 stops instantly and 1 never slows.
flight_horizontal_acceleration: 2.5
flight_horizontal_deceleration: 0.8
flight_horizontal_max_speed: 5000
flight_vertical_acceleration: 0.2
flight_vertical_deceleration: 0.97
flight_vertical_max_speed: 5000
